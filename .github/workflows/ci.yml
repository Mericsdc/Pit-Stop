name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check source files
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Check deployment script
        run: bash -n deploy/install.sh
      - name: Build container
        run: docker build --tag pit-stop:ci .
