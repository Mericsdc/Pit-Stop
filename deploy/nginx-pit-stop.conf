# Install as a separate nginx server block; keep existing sites unchanged.
# Replace the server_name if deploying on a different machine.
server {
    listen 80;
    listen [::]:80;
    server_name pit-stop.2-26-171-43.sslip.io pit-stop.2-26-171-43.nip.io;
    client_max_body_size 32k;
    location /.well-known/acme-challenge/ {
        root /var/www/pit-stop-acme;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
